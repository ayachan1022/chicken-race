<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ========================================
// CSV読み込み・パース
// ========================================
const CSV_PATH = "../data/screener_result.csv";

function parseLine(line) {
  const result = [];
  let cur = "";
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === "," && !inQuote) { result.push(cur.trim()); cur = ""; }
    else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = parseLine(lines[0]).map(h => h.replace(/^"|"$/g, "").replace(/^\uFEFF/, ""));
  const idxCode   = headers.findIndex(h => h === "コード");
  const idxName   = headers.findIndex(h => h === "銘柄名");
  const idxOku    = headers.findIndex(h => h.includes("時価総額(億円)") || h.includes("時価総額（億円）"));
  const idxCho    = headers.findIndex(h => h.includes("時価総額(兆円)") || h.includes("時価総額（兆円）"));
  const idxRankCD = headers.findIndex(h => h === "ランクCD");
  if (idxCode===-1||idxName===-1||idxOku===-1||idxCho===-1||idxRankCD===-1) {
    throw new Error(`CSVの列名が想定と異なります。\n見つかった列: ${headers.join(", ")}`);
  }
  return lines.slice(1).map(line => {
    const cols   = parseLine(line);
    const code   = cols[idxCode]   || "";
    const name   = cols[idxName]   || "";
    const oku    = parseFloat((cols[idxOku]||"").replace(/,/g,""))    || 0;
    const cho    = parseFloat((cols[idxCho]||"").replace(/,/g,""))    || 0;
    const rankCD = parseInt(cols[idxRankCD]||"0", 10);
    return { code, name, oku, cho, rankCD };
  }).filter(r => r.code && r.name && r.cho > 0 && r.rankCD > 0);
}

const RANK_LIMITS = {1:10, 2:35, 3:25, 4:10, 5:10, 6:5, 7:5};

function selectCompanies(allCompanies) {
  const byRank = {};
  allCompanies.forEach(c => {
    if (!byRank[c.rankCD]) byRank[c.rankCD] = [];
    byRank[c.rankCD].push(c);
  });
  const result = [];
  const usedCodes = new Set();
  let shortfall = 0;
  Object.entries(RANK_LIMITS).forEach(([rankCD, limit]) => {
    const pool = byRank[Number(rankCD)] || [];
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    const picked = shuffled.slice(0, limit);
    picked.forEach(c => usedCodes.add(c.code));
    result.push(...picked);
    if (picked.length < limit) shortfall += (limit - picked.length);
  });
  // ランク別の母数が不足していた場合、他のランクの余り企業からランダムに補充して総数を維持する
  if (shortfall > 0) {
    const remaining = allCompanies.filter(c => !usedCodes.has(c.code));
    const shuffledRemaining = [...remaining].sort(() => Math.random() - 0.5);
    result.push(...shuffledRemaining.slice(0, shortfall));
  }
  return result.sort((a, b) => a.code.localeCompare(b.code, undefined, {numeric: true}));
}

const TARGET = {easy:100, normal:50, hard:10};
const C = "#2E2E2E";

function generateRoomId() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:6}, ()=>chars[Math.floor(Math.random()*chars.length)]).join("");
}

function addComma(n){ return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function fmtCho(triVal){
  const [intPart, decPart] = triVal.toFixed(2).split(".");
  return addComma(intPart) + "." + decPart + "兆円";
}
function fmtOku(triVal){
  return addComma(Math.round(triVal*10000)) + "億円";
}
function fmt(triVal, unit){
  return unit==="oku" ? fmtOku(triVal) : fmtCho(triVal);
}

// ========================================
// ゲーム画面（1人プレイ）
// ========================================
function GameScreen({difficulty, companies, onStop, onTimeout}){
  const targetTri = TARGET[difficulty];
  const [selected, setSelected] = useState([]);
  const [popup, setPopup]       = useState(null);
  const [stopDlg, setStopDlg]   = useState(false);
  const [showList, setShowList] = useState(false);
  const [timeLeft, setTimeLeft] = useState(300);
  const [guesses, setGuesses]   = useState({});
  const timerRef    = useRef(null);
  const selRef      = useRef([]);
  const guessRef    = useRef({});
  const onStopRef   = useRef(onStop);
  const onTimeoutRef= useRef(onTimeout);
  useEffect(()=>{ onStopRef.current=onStop; onTimeoutRef.current=onTimeout; });

  useEffect(()=>{
    timerRef.current = setInterval(()=>{
      setTimeLeft(t=>{
        if(t<=1){ clearInterval(timerRef.current); onTimeoutRef.current(selRef.current, guessRef.current); return 0; }
        return t-1;
      });
    },1000);
    return ()=>clearInterval(timerRef.current);
  },[]);

  const mm = String(Math.floor(timeLeft/60)).padStart(2,"0");
  const ss = String(timeLeft%60).padStart(2,"0");
  const selCodes = new Set(selected.map(s=>s.code));

  function tapCell(c){
    if(selCodes.has(c.code)) return;
    setPopup(c);
  }
  function confirmSelect(){
    const c=popup; setPopup(null);
    const next=[...selected,c];
    setSelected(next);
    selRef.current=next;
    // 全企業選択したら自動終了
    if(next.length >= companies.length){
      clearInterval(timerRef.current);
      onStopRef.current(next, guessRef.current);
    }
  }
  function doStop(){ clearInterval(timerRef.current); onStopRef.current(selected, guessRef.current); }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",position:"relative",background:"#FAFAF9",overflow:"hidden"}}>
      <div style={{background:"#fff",borderBottom:"0.5px solid #E8E6E1",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px 0"}}>
          <button style={{background:"none",border:"none",fontSize:22,color:"#8A8983",cursor:"default",padding:0,opacity:0.3,fontFamily:"inherit"}}>‹</button>
          <div style={{display:"flex",gap:14,color:"#8A8983",fontSize:17,opacity:0.4,cursor:"default"}}>
            <span>☰</span><span>?</span><span>…</span>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 14px 10px"}}>
          <span style={{fontSize:16,fontWeight:700,color:C,textDecoration:"underline",textUnderlineOffset:3}}>
            {targetTri}兆円に近づけろ！
          </span>
          <span style={{fontSize:16,fontWeight:700,color:C}}>残り {mm}:{ss}</span>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",overflowX:"hidden",padding:"10px 10px 0"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {companies.map((c)=>{
            const sel=selCodes.has(c.code);
            return (
              <button key={c.code} onClick={()=>tapCell(c)} style={{
                textAlign:"left",padding:"10px 12px",
                background: sel?"#E8E6E1":"#fff",
                borderRadius:8,border:"0.5px solid #E8E6E1",
                cursor: sel?"default":"pointer",
                minWidth:0,fontFamily:"inherit",
              }}>
                <div style={{fontSize:10,color:sel?"#8A8983":"#8A8983",marginBottom:2}}>{c.code}</div>
                <div style={{fontSize:12,fontWeight:500,color:sel?"#8A8983":C,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</div>
              </button>
            );

      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",borderTop:"0.5px solid #E8E6E1",background:"#fff",flexShrink:0}}>
        <button onClick={()=>setShowList(true)} style={{border:"1px solid #E8E6E1",background:"#fff",color:C,fontSize:13,padding:"7px 22px",borderRadius:8,cursor:"pointer",fontFamily:"inherit"}}>自分のリスト</button>

  const diff      = targetTri - total;
  const isOver    = diff < 0;
  const [unit, setUnit] = useState("cho");

  function fmtGuess(c){
    const cho = parseFloat((guesses[c.code]||{}).cho||"0")||0;
    const oku = parseFloat((guesses[c.code]||{}).oku||"0")||0;
    const totalTri = cho + oku/10000;
    if(cho===0 && oku===0) return null;
    return fmt(totalTri, unit).replace("円","");
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",background:"#FAFAF9",overflow:"hidden"}}>
      <div style={{padding:"28px 20px 16px",textAlign:"center",borderBottom:"0.5px solid #E8E6E1",position:"relative",flexShrink:0}}>
        <div style={{position:"absolute",right:16,top:14,display:"flex",alignItems:"center",gap:8}}>
          <div style={{display:"flex",borderRadius:6,border:"1px solid #E8E6E1",overflow:"hidden",fontSize:11}}>
            <button onClick={()=>setUnit("cho")} style={{padding:"3px 8px",border:"none",cursor:"pointer",fontFamily:"inherit",background:unit==="cho"?"#2E2E2E":"#fff",color:unit==="cho"?"#fff":"#8A8983"}}>兆</button>
            <button onClick={()=>setUnit("oku")} style={{padding:"3px 8px",border:"none",cursor:"pointer",fontFamily:"inherit",background:unit==="oku"?"#2E2E2E":"#fff",color:unit==="oku"?"#fff":"#8A8983"}}>億</button>
          </div>
          <button style={{background:"none",border:"none",fontSize:18,color:"#8A8983",cursor:"default",fontFamily:"inherit",opacity:0.5}} disabled>↑</button>
        </div>
        <div style={{fontSize:11,letterSpacing:"0.2em",color:"#8A8983",marginBottom:10}}>RESULT</div>
        <div style={{fontSize:26,fontWeight:500,color:isDobun?"#E24B4A":C}}>
          {isDobun?"ドボン":"結果発表"}
        </div>
      </div>

      <div style={{padding:"12px 18px",borderBottom:"0.5px solid #E8E6E1",flexShrink:0}}>
        <div style={{fontSize:11,color:"#8A8983",textAlign:"right",marginBottom:6}}>直近の終値を参考</div>
        {[
          ["目標金額",     fmt(targetTri,unit), false],
          ["あなたの合計", fmt(total,unit),     false],
          ["差額", (isOver?"+":"−")+fmt(Math.abs(diff),unit), isOver],
        ].map(([label,val,red])=>(
          <div key={label} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"0.5px solid #E8E6E1",fontSize:13}}>
            <span style={{color:"#8A8983"}}>{label}</span>
            <span style={{fontWeight:500,color:red?"#E24B4A":C}}>{val}</span>
          </div>
        ))}
      </div>

      <div style={{background:"#FAFAF9",padding:"5px 18px",borderBottom:"0.5px solid #E8E6E1",flexShrink:0}}>
        <div style={{display:"flex",fontSize:10,color:"#8A8983",gap:4}}>
          <span style={{minWidth:34}}>コード</span>
          <span style={{flex:1}}>銘柄</span>
          <span style={{minWidth:60,textAlign:"right"}}>予想</span>
          <span style={{minWidth:70,textAlign:"right"}}>実際</span>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {selected.length===0 && <p style={{textAlign:"center",color:"#8A8983",fontSize:13,padding:"24px 0"}}>銘柄を選択しませんでした</p>}
        {selected.map((c,i)=>(
          <div key={c.code} className="reveal-row" style={{display:"flex",alignItems:"center",gap:4,padding:"9px 18px",borderBottom:"0.5px solid #E8E6E1",fontSize:12,animationDelay:`${Math.min(i*0.05,0.6)}s`}}>
            <span style={{color:"#8A8983",fontSize:10,minWidth:34}}>{c.code}</span>
            <span style={{flex:1,color:C,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</span>
            <span style={{minWidth:60,textAlign:"right",color:"#8A8983"}}>{fmtGuess(c)||"−"}</span>
            <span style={{minWidth:70,textAlign:"right",fontWeight:500,color:C}}>{fmt(c.cho,unit)}</span>
          </div>
        ))}
      </div>

      <div style={{padding:"12px 18px 40px",display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
        <button className="btn-dark" onClick={onRetry}>もう一度</button>
        <button className="btn-white" onClick={onTop}>トップに戻る</button>
      </div>
    </div>
  );
}

// ========================================
// ルーム作成・待機画面
// ========================================
function RoomWaitScreen({roomId, role, difficulty, guestJoined, onStart, onLeave}){
  const url = `${location.origin}${location.pathname}?room=${roomId}`;
  const [copied, setCopied] = useState(false);
  const qrRef = useRef(null);
  const qrInstanceRef = useRef(null);

  useEffect(()=>{
    if(qrRef.current && !qrInstanceRef.current){
      qrInstanceRef.current = new QRCode(qrRef.current, {
        text: url,
        width: 180,
        height: 180,
        colorDark: "#2E2E2E",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M,
      });
    }
  },[]);

  function copyUrl(){
    navigator.clipboard.writeText(url).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",background:"#FAFAF9"}}>
      <div style={{display:"flex",alignItems:"center",padding:"10px 14px",borderBottom:"0.5px solid #E8E6E1",flexShrink:0}}>
        <button onClick={onLeave} style={{background:"none",border:"none",fontSize:22,color:"#8A8983",cursor:"pointer",fontFamily:"inherit"}}>‹</button>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"24px 20px"}}>
        <div style={{background:"#E8E6E1",borderRadius:10,padding:"12px 16px",marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:12,color:"#8A8983"}}>難易度</span>
          <span style={{fontSize:14,fontWeight:600,color:C}}>{difficulty==="easy"?"Easy / 100兆円":difficulty==="normal"?"Normal / 50兆円":"Hard / 10兆円"}</span>
        </div>

        <div style={{display:"flex",justifyContent:"center",marginBottom:16}}>
          <div ref={qrRef} style={{borderRadius:8,border:"1px solid #E8E6E1",overflow:"hidden",lineHeight:0}}/>
        </div>

        <div style={{display:"flex",gap:8,marginBottom:24}}>
          <div style={{flex:1,background:"#E8E6E1",borderRadius:8,padding:"10px 12px",fontSize:11,color:"#8A8983",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{url}</div>
          <button onClick={copyUrl} style={{background:"#2E2E2E",color:"#fff",border:"none",borderRadius:8,padding:"10px 16px",fontSize:12,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>
            {copied?"コピー済":"コピー"}
          </button>
        </div>

        <div style={{borderRadius:10,border:"1px solid #E8E6E1",overflow:"hidden",marginBottom:24}}>
          {[
            {label:"ホスト", joined:true},
            {label:"ゲスト", joined:guestJoined},
          ].map(p=>(
            <div key={p.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"0.5px solid #E8E6E1"}}>
              <span style={{fontSize:13,color:C}}>{p.label}</span>
              <span style={{fontSize:12,color:p.joined?"#4CAF50":"#8A8983"}}>{p.joined?"✓ 入室済み":"入室待ち..."}</span>
            </div>
          ))}
        </div>

        {role==="host" && (
          <button className="btn-dark" onClick={onStart} disabled={!guestJoined}
            style={{opacity:guestJoined?1:0.4,cursor:guestJoined?"pointer":"not-allowed"}}>
            ゲームを開始する
          </button>
        )}
        {role==="guest" && (
          <div style={{textAlign:"center",fontSize:13,color:"#8A8983",padding:"12px 0"}}>ホストの開始を待っています...</div>
        )}
      </div>
    </div>
  );
}

// ========================================
// ゲーム画面（2人対戦・ターン制）
// ========================================
function VsGameScreen({difficulty, companies, role, roomId, uid, onGameEnd, onRetry}){
  const targetTri = TARGET[difficulty];
  const [mySelected, setMySelected]     = useState([]);
  const [oppSelected, setOppSelected]   = useState([]);
  const [allSelCodes, setAllSelCodes]   = useState(new Set());
  const [popup, setPopup]               = useState(null);
  const [stopDlg, setStopDlg]           = useState(false);
  const [showMyList, setShowMyList]     = useState(false);
  const [showOppList, setShowOppList]   = useState(false);
  const [toast, setToast]               = useState(null);
  const [toastKey, setToastKey]         = useState(0);
  const [myStopped, setMyStopped]       = useState(false);
  const [oppStopped, setOppStopped]     = useState(false);
  const [showOppStopped, setShowOppStopped] = useState(false); // ①相手STOP通知オーバーレイ
  const [stopTimeLeft, setStopTimeLeft] = useState(null);
  const [guesses, setGuesses]           = useState({});
  const [disconnected, setDisconnected] = useState(false);

  const [currentTurn, setCurrentTurn]   = useState(null);
  const [turnTimeLeft, setTurnTimeLeft] = useState(60);
  const [showTimeUp, setShowTimeUp]     = useState(false);
  const [showAllSelected, setShowAllSelected] = useState(false); // 全企業選択完了メッセージ

  const stopTimerRef    = useRef(null);
  const turnTimerRef    = useRef(null);
  const mySelRef        = useRef([]);
  const guessRef        = useRef({});
  const currentTurnRef  = useRef(null);
  const myStoppedRef    = useRef(false);
  const oppSelectedRef  = useRef([]);
  const gameEndedRef    = useRef(false);
  const allSelCodesRef  = useRef(new Set());
  const allSelectedTriggeredRef = useRef(false); // 全企業選択メッセージの二重発火防止
  const oppRole         = role==="host" ? "guest" : "host";
  const roomRef         = useRef(db.ref(`rooms/${roomId}`)).current;
  const isMyTurn        = currentTurn === role && !myStopped;

  // 両者の選択を合わせて企業リストの母数に達したかをその場で判定する
  // （useEffectのstate更新待ちだと検知が遅れる/取りこぼすケースがあったため、
  //   選択が確定した瞬間に同期的にチェックする方式に変更）
  function checkAllSelected(){
    if(companies.length>0 && allSelCodesRef.current.size >= companies.length
       && !gameEndedRef.current && !allSelectedTriggeredRef.current){
      allSelectedTriggeredRef.current = true;
      clearInterval(turnTimerRef.current);
      setShowAllSelected(true);
      setTimeout(()=>{ handleGameEnd(); }, 1800);
      return true;
    }
    return false;
  }

  // 相手のターン開始をトーストで通知（選択通知と同じ見せ方）
  function showOppTurnToast(){
    setToast("__opp_turn__"); // 特殊キーでターン通知と選択通知を区別
    setToastKey(k=>k+1);
  }

  // ターンタイマー（1分）
  useEffect(()=>{
    if(currentTurn===null) return;
    clearInterval(turnTimerRef.current);
    // 安全策：ターンが回ってきた時点ですでに全企業選択済みなら、タイマーを開始せず終了させる
    if(checkAllSelected()) return;
    setTurnTimeLeft(60);
    if(currentTurn === role && !myStoppedRef.current){
      turnTimerRef.current = setInterval(()=>{
        setTurnTimeLeft(t=>{
          if(t<=1){
            clearInterval(turnTimerRef.current);
            handleTurnTimeUp();
            return 0;
          }
          return t-1;
        });
      }, 1000);
    }
    return ()=>clearInterval(turnTimerRef.current);
  },[currentTurn]);

  // STOP後2分タイマー
  useEffect(()=>{
    if(stopTimeLeft===null) return;
    if(stopTimeLeft<=0){ handleGameEnd(); return; }
    stopTimerRef.current = setTimeout(()=>setStopTimeLeft(t=>t-1), 1000);
    return ()=>clearTimeout(stopTimerRef.current);
  },[stopTimeLeft]);

  useEffect(()=>{ if(disconnected){ setTimeout(()=>handleGameEnd(true), 1500); } },[disconnected]);

  // Firebase購読
  useEffect(()=>{
    const oppSelRef  = roomRef.child(`players/${oppRole}/selections`);
    const oppStopRef = roomRef.child(`players/${oppRole}/stopped`);
    const oppConRef  = roomRef.child(`players/${oppRole}/connected`);
    const turnRef    = roomRef.child("turn/current");
    const statusRef  = roomRef.child("status");

    // 相手の選択を購読
    const prevOppCodes = new Set();
    oppSelRef.on("value", snap=>{
      const data = snap.val() || {};
      // タイムスタンプ順にソートして選択順を保持
      const entries = Object.entries(data).sort(([,a],[,b]) => a - b);
      const codes = entries.map(([code]) => code);
      codes.forEach(code=>{
        if(!prevOppCodes.has(code)){
          prevOppCodes.add(code);
          const company = companies.find(c=>c.code===code);
          if(company){
            setToast(company.name);
            setToastKey(k=>k+1);
          }
        }
      });
      const oppList = codes.map(code=>companies.find(c=>c.code===code)).filter(Boolean);
      oppSelectedRef.current = oppList;
      setOppSelected(oppList);
      codes.forEach(c=>allSelCodesRef.current.add(c));
      setAllSelCodes(new Set(allSelCodesRef.current));
      checkAllSelected();
    });

    // ターンを購読
    turnRef.on("value", snap=>{
      const t = snap.val();
      if(!t) return;
      currentTurnRef.current = t;
      setCurrentTurn(t);
      if(t !== role && !myStoppedRef.current){
        showOppTurnToast();
      }
    });

    // 相手のSTOP購読
    oppStopRef.on("value", snap=>{
      if(snap.val()===true){
        setOppStopped(true);
        setShowOppStopped(true); // ①オーバーレイ表示
        if(myStoppedRef.current){
          handleGameEnd();
        }
        // stopTimeLeftの起動はdeadlineAt購読側に一本化（下記useEffect参照）
      }
    });

    // 締切（deadlineAt）をFirebaseから購読：どちらの端末でも同じ締切を共有し、
    // 締切に達した側が誰でもゲームを終了できるようにする（host限定バグの回避）
    const deadlineRef = roomRef.child("timer/deadlineAt");
    deadlineRef.on("value", snap=>{
      const deadline = snap.val();
      if(!deadline || myStoppedRef.current) return;
      const remain = Math.max(0, Math.round((deadline - Date.now())/1000));
      setStopTimeLeft(remain);
    });

    // 切断検知
    oppConRef.on("value", snap=>{ if(snap.val()===false){ setDisconnected(true); } });

    // 自分の接続登録
    const myConRef = roomRef.child(`players/${role}/connected`);
    myConRef.set(true);
    myConRef.onDisconnect().set(false);

    // ── ④ status 購読はゲスト専用（"finished" 検知で結果画面へ） ──
    // ホスト側は handleGameEnd() が直接 status:"finished" を書き込むので購読不要
    // "waiting" 検知（再戦）は App レベルの guestwait 監視に移管済みのためここでは扱わない
    if(role === "guest"){
      statusRef.on("value", snap=>{
        const s = snap.val();
        if(s === "finished" && !gameEndedRef.current){
          gameEndedRef.current = true;
          cleanup();
          roomRef.once("value", roomSnap=>{
            const data = roomSnap.val() || {};
            const mySelectionsRaw  = data.players?.[role]?.selections    || {};
            const oppSelectionsRaw = data.players?.[oppRole]?.selections || {};
            const sortByTime = (raw) =>
              Object.entries(raw)
                .sort(([,a],[,b]) => a - b)
                .map(([code]) => companies.find(c=>c.code===code))
                .filter(Boolean);
            onGameEnd(
              mySelRef.current.length > 0 ? mySelRef.current : sortByTime(mySelectionsRaw),
              oppSelectedRef.current.length > 0 ? oppSelectedRef.current : sortByTime(oppSelectionsRaw),
              guessRef.current, false
            );
          });
        }
      });
    }

    return ()=>cleanup();
  },[]);

  function cleanup(){
    roomRef.child(`players/${oppRole}/selections`).off();
    roomRef.child(`players/${oppRole}/stopped`).off();
    roomRef.child(`players/${oppRole}/connected`).off();
    roomRef.child("turn/current").off();
    roomRef.child("timer/deadlineAt").off();
    if(role === "guest") roomRef.child("status").off();
    clearInterval(turnTimerRef.current);
    clearTimeout(stopTimerRef.current);
  }

  function handleTurnTimeUp(){
    setShowTimeUp(true);
    setTimeout(()=>{
      setShowTimeUp(false);
      advanceTurn();
    }, 2000);
  }

  function advanceTurn(){
    const next = currentTurnRef.current === "host" ? "guest" : "host";
    roomRef.child("turn/current").set(next);
    roomRef.child("turn/startedAt").set(firebase.database.ServerValue.TIMESTAMP);
  }

  function handleGameEnd(isDisconnect=false){
    if(gameEndedRef.current) return;
    gameEndedRef.current = true;
    cleanup();
    // host/guestどちらが締切に到達しても終了を書き込めるようにする
    // （以前はhost限定だったため、hostが先にSTOPしゲストが時間切れになると
    //  statusが更新されずhost側が固まる不具合があった）
    roomRef.child("status").set("finished");
    onGameEnd(mySelRef.current, oppSelectedRef.current, guessRef.current, isDisconnect);
  }

  function tapCell(c){
    if(allSelCodes.has(c.code)) return;
    if(myStopped) return;
    if(!oppStopped && !isMyTurn){
      showOppTurnToast();
      return;
    }
    setPopup(c);
  }

  function confirmSelect(){
    const c=popup; setPopup(null);
    roomRef.child(`players/${role}/selections/${c.code}`).transaction(current=>{
      if(current !== null) return;
      return firebase.database.ServerValue.TIMESTAMP;
    }, (err, committed)=>{
      if(committed){
        const next=[...mySelRef.current, c];
        mySelRef.current=next;
        setMySelected(next);
        allSelCodesRef.current.add(c.code);
        setAllSelCodes(new Set(allSelCodesRef.current));
        if(checkAllSelected()) return; // 全企業選択済みならターン交代せず終了
        if(!oppStopped){
          clearInterval(turnTimerRef.current);
          advanceTurn();
        }
      }
    });
  }

  function doStop(){
    myStoppedRef.current = true;
    setMyStopped(true);
    clearInterval(turnTimerRef.current);
    roomRef.child(`players/${role}/stopped`).set(true);
    roomRef.child(`players/${role}/stoppedAt`).set(firebase.database.ServerValue.TIMESTAMP);
    if(!oppStopped){
      // 自分が最初にSTOPした側：2分後の締切をFirebaseに書き込み、両者が同じ締切を参照できるようにする
      roomRef.child("timer/deadlineAt").set(firebase.database.ServerValue.TIMESTAMP).then(()=>{
        roomRef.child("timer/deadlineAt").once("value", snap=>{
          const t = snap.val();
          if(t) roomRef.child("timer/deadlineAt").set(t + 120000);
        });
      });
    }
    if(oppStopped){ handleGameEnd(); }
  }

  const isMyTurnDisplay = currentTurn === role;
  const turnMm = String(Math.floor(turnTimeLeft/60)).padStart(2,"0");
  const turnSs = String(turnTimeLeft%60).padStart(2,"0");
  const stopMm = stopTimeLeft!==null ? String(Math.floor(stopTimeLeft/60)).padStart(2,"0") : "--";
  const stopSs = stopTimeLeft!==null ? String(stopTimeLeft%60).padStart(2,"0") : "--";

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",position:"relative",background:"#FAFAF9",overflow:"hidden"}}>

      <div style={{background:"#fff",borderBottom:"0.5px solid #E8E6E1",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px 0"}}>
          <span style={{fontSize:12,color:"#8A8983"}}>{role==="host"?"ホスト":"ゲスト"}</span>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {stopTimeLeft!==null && !myStopped && (
              <span style={{fontSize:13,fontWeight:700,color:"#E24B4A"}}>残り {stopMm}:{stopSs}</span>
            )}
            {myStopped && <span style={{fontSize:11,color:"#8A8983"}}>STOP済</span>}
            {oppStopped && <span style={{fontSize:11,color:"#E24B4A"}}>相手STOP済</span>}
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 14px 10px"}}>
          <span style={{fontSize:16,fontWeight:700,color:C,textDecoration:"underline",textUnderlineOffset:3}}>
            {TARGET[difficulty]}兆円に近づけろ！
          </span>
          {!myStopped && currentTurn && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end"}}>
              <span style={{fontSize:11,color:isMyTurnDisplay?"#4CAF50":"#8A8983",fontWeight:600}}>
                {isMyTurnDisplay?"あなたのターン":"相手のターン"}
              </span>
              {isMyTurnDisplay && (
                <span style={{fontSize:13,fontWeight:700,color:turnTimeLeft<=10?"#E24B4A":C}}>
                  {turnMm}:{turnSs}
                </span>
              )}
            </div>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",overflowX:"hidden",padding:"10px 10px 0"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {companies.map((c)=>{
            const mySel = mySelRef.current.some(s=>s.code===c.code);
            const oppSel = oppSelected.some(s=>s.code===c.code);
            const greyout = mySel || oppSel || myStopped;
            return (
              <button key={c.code} onClick={()=>tapCell(c)} style={{
                textAlign:"left",padding:"10px 12px",
                background: greyout?"#E8E6E1":"#fff",
                borderRadius:8,border: oppSel?"1px solid #E24B4A":"0.5px solid #E8E6E1",
                cursor: greyout?"default":"pointer",
                minWidth:0,fontFamily:"inherit",
              }}>
                <div style={{fontSize:10,color:greyout?"#8A8983":"#8A8983",marginBottom:2}}>{c.code}</div>
                <div style={{fontSize:12,fontWeight:500,color:greyout?"#8A8983":C,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</div>
                {oppSel && <div style={{fontSize:9,color:"#E24B4A",marginTop:1}}>相手選択済</div>}
              </button>
            );
          })}
        </div>
        <div style={{height:10}}/>
      </div>

function VsResultScreen({difficulty, mySelected, oppSelected, role, isDisconnect, retryRequested, guesses, onRetry, onTop}){
  const targetTri = TARGET[difficulty];
  const myTotal  = mySelected.reduce((s,c)=>s+c.cho, 0);
  const oppTotal = oppSelected.reduce((s,c)=>s+c.cho, 0);
  const myDiff   = Math.abs(targetTri - myTotal);
  const oppDiff  = Math.abs(targetTri - oppTotal);
  const myDobun  = myTotal > targetTri;
  const oppDobun = oppTotal > targetTri;
  const [unit, setUnit] = useState("cho");

  let verdict = "";
  if(!isDisconnect){
    if(myDobun && oppDobun)       verdict = "引き分け";
    else if(myDobun)              verdict = "負け";
    else if(oppDobun)             verdict = "勝ち！";
    else if(myDiff < oppDiff)     verdict = "勝ち！";
    else if(myDiff > oppDiff)     verdict = "負け";
    else                          verdict = "引き分け";
  }

  const verdictColor = verdict==="勝ち！" ? "#4CAF50" : verdict==="負け" ? "#E24B4A" : C;

  function fmtGuess(c){
    const cho = parseFloat((guesses[c.code]||{}).cho||"0")||0;
    const oku = parseFloat((guesses[c.code]||{}).oku||"0")||0;
    const totalTri = cho + oku/10000;
    if(cho===0 && oku===0) return null;
    return fmt(totalTri, unit).replace("円","");
  }

  // 自分のリスト：予想列あり
  function MyCompanyList({list, label, isDobun}){
    return (
      <div style={{marginBottom:16}}>
        <div style={{background:"#FAFAF9",padding:"5px 18px",borderBottom:"0.5px solid #E8E6E1"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",fontSize:10,color:"#8A8983",gap:4,flex:1}}>
              <span style={{minWidth:34}}>コード</span>
              <span style={{flex:1}}>{label}（{list.length}社）</span>
              <span style={{minWidth:52,textAlign:"right"}}>予想</span>
              <span style={{minWidth:70,textAlign:"right"}}>実際</span>
            </div>
            {isDobun && <span style={{fontSize:11,color:"#E24B4A",fontWeight:600,marginLeft:8,flexShrink:0}}>ドボン</span>}
          </div>
        </div>
        {list.length===0 && <p style={{textAlign:"center",color:"#8A8983",fontSize:13,padding:"12px 0"}}>銘柄を選択しませんでした</p>}
        {list.map((c,i)=>(
          <div key={c.code} className="reveal-row" style={{display:"flex",alignItems:"center",gap:4,padding:"8px 18px",borderBottom:"0.5px solid #E8E6E1",fontSize:12,animationDelay:`${Math.min(i*0.05,0.6)}s`}}>
            <span style={{color:"#8A8983",fontSize:10,minWidth:34}}>{c.code}</span>
            <span style={{flex:1,color:C,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</span>
            <span style={{minWidth:52,textAlign:"right",color:"#8A8983"}}>{fmtGuess(c)||"−"}</span>
            <span style={{minWidth:70,textAlign:"right",fontWeight:500,color:C}}>{fmt(c.cho,unit)}</span>
          </div>
        ))}
      </div>
    );
  }

  // 相手のリスト：予想列なし
  function OppCompanyList({list, label, isDobun}){
    return (
      <div style={{marginBottom:16}}>
        <div style={{background:"#FAFAF9",padding:"5px 18px",borderBottom:"0.5px solid #E8E6E1"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:11,color:"#8A8983"}}>{label}の選択銘柄（{list.length}社）</span>
            {isDobun && <span style={{fontSize:11,color:"#E24B4A",fontWeight:600}}>ドボン</span>}
          </div>
        </div>
        {list.length===0 && <p style={{textAlign:"center",color:"#8A8983",fontSize:13,padding:"12px 0"}}>銘柄を選択しませんでした</p>}
        {list.map((c,i)=>(
          <div key={c.code} className="reveal-row" style={{display:"flex",alignItems:"center",gap:4,padding:"8px 18px",borderBottom:"0.5px solid #E8E6E1",fontSize:12,animationDelay:`${Math.min(i*0.05,0.6)}s`}}>
            <span style={{color:"#8A8983",fontSize:10,minWidth:34}}>{c.code}</span>
            <span style={{flex:1,color:C,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</span>
            <span style={{minWidth:70,textAlign:"right",fontWeight:500,color:C}}>{fmt(c.cho,unit)}</span>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",background:"#FAFAF9",overflow:"hidden"}}>
      <div style={{padding:"24px 20px 16px",textAlign:"center",borderBottom:"0.5px solid #E8E6E1",position:"relative",flexShrink:0}}>
        <div style={{position:"absolute",right:16,top:14,display:"flex",borderRadius:6,border:"1px solid #E8E6E1",overflow:"hidden",fontSize:11}}>
          <button onClick={()=>setUnit("cho")} style={{padding:"3px 8px",border:"none",cursor:"pointer",fontFamily:"inherit",background:unit==="cho"?"#2E2E2E":"#fff",color:unit==="cho"?"#fff":"#8A8983"}}>兆</button>
          <button onClick={()=>setUnit("oku")} style={{padding:"3px 8px",border:"none",cursor:"pointer",fontFamily:"inherit",background:unit==="oku"?"#2E2E2E":"#fff",color:unit==="oku"?"#fff":"#8A8983"}}>億</button>
        </div>
        <div style={{fontSize:11,letterSpacing:"0.2em",color:"#8A8983",marginBottom:10}}>RESULT</div>
        {isDisconnect ? (
          <div style={{fontSize:20,fontWeight:500,color:"#8A8983"}}>相手が切断しました</div>
        ) : (
          <div style={{fontSize:28,fontWeight:500,color:verdictColor}}>{verdict}</div>
        )}
      </div>

      <div style={{padding:"12px 18px",borderBottom:"0.5px solid #E8E6E1",flexShrink:0}}>
        <div style={{fontSize:11,color:"#8A8983",textAlign:"right",marginBottom:6}}>直近の終値を参考</div>
        <div style={{display:"flex",gap:4,fontSize:11,color:"#8A8983",marginBottom:4}}>
          <span style={{flex:1}}/>
          <span style={{minWidth:80,textAlign:"right"}}>自分</span>
          {!isDisconnect && <span style={{minWidth:80,textAlign:"right"}}>相手</span>}
        </div>
        {[
          ["目標金額", fmt(targetTri,unit), fmt(targetTri,unit)],
          ["合計",     fmt(myTotal,unit),   fmt(oppTotal,unit)],
          ["差額",     (myDobun?"+":"−")+fmt(myDiff,unit), (oppDobun?"+":"−")+fmt(oppDiff,unit)],
        ].map(([label, myVal, oppVal])=>(
          <div key={label} style={{display:"flex",padding:"6px 0",borderBottom:"0.5px solid #E8E6E1",fontSize:12}}>
            <span style={{flex:1,color:"#8A8983"}}>{label}</span>
            <span style={{minWidth:80,textAlign:"right",fontWeight:500,color:label==="差額"&&myDobun?"#E24B4A":C}}>{myVal}</span>
            {!isDisconnect && <span style={{minWidth:80,textAlign:"right",fontWeight:500,color:label==="差額"&&oppDobun?"#E24B4A":"#8A8983"}}>{oppVal}</span>}
          </div>
        ))}
      </div>

      <div style={{flex:1,overflowY:"auto"}}>
        <MyCompanyList  list={mySelected}  label={role==="host"?"ホスト（自分）":"ゲスト（自分）"}  isDobun={myDobun}/>
        {!isDisconnect && <OppCompanyList list={oppSelected} label={role==="host"?"ゲスト（相手）":"ホスト（相手）"} isDobun={oppDobun}/>}
      </div>

      <div style={{padding:"12px 18px 40px",display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
        {role==="host" && retryRequested ? (
          <button className="btn-dark" onClick={onRetry} style={{background:"#4CAF50"}}>
            相手が再戦を希望しています！開始する
          </button>
        ) : (
          <button className="btn-dark" onClick={onRetry}>もう一度</button>
        )}
        <button className="btn-white" onClick={onTop}>トップに戻る</button>
      </div>
    </div>
  );
}

function CountdownScreen({myTurn, onDone}){
  const [count, setCount] = useState(3);
  useEffect(()=>{
    const timer = setInterval(()=>{
      setCount(c=>{
        if(c<=1){ clearInterval(timer); setTimeout(onDone, 800); return 0; }
        return c-1;
      });
    }, 1000);
    return ()=>clearInterval(timer);
  },[]);

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100dvh",background:"#FAFAF9"}}>
      <div style={{fontSize:14,color:"#8A8983",marginBottom:24}}>
        {myTurn ? "あなたが先攻です！" : "あなたは後攻です！"}
      </div>
      <div style={{fontSize:80,fontWeight:700,color:count===0?"#4CAF50":"#2E2E2E",lineHeight:1,transition:"color 0.2s"}}>
        {count===0?"GO!":count}
      </div>
    </div>
  );
}

// App（画面管理）
// ========================================
function App(){
  const [screen, setScreen]             = useState("loading");
  const [difficulty, setDiff]           = useState("normal");
  const [mode, setMode]                 = useState("solo");
  const [result, setResult]             = useState({selected:[],isDobun:false,guesses:{}});
  const [vsResult, setVsResult]         = useState({mySelected:[],oppSelected:[],isDisconnect:false});
  const [gameKey, setGameKey]           = useState(0);
  const [allCompanies, setAllCompanies] = useState(null);
  const [companies, setCompanies]       = useState([]);
  const [loadError, setLoadError]       = useState(null);
  const [roomId, setRoomId]             = useState(null);
  const [role, setRole]                 = useState(null);
  const [uid, setUid]                   = useState(null);
  const [guestJoined, setGuestJoined]   = useState(false);
  const [firstTurn, setFirstTurn]       = useState(null);

  useEffect(()=>{ loadCSV(); },[]);

  useEffect(()=>{
    const params = new URLSearchParams(location.search);
    const rid = params.get("room");
    if(rid){
      setRoomId(rid);
      setRole("guest");
      setMode("vs");
      auth.signInAnonymously().then(cred=>{
        setUid(cred.user.uid);
        const roomRef = db.ref(`rooms/${rid}`);
        roomRef.child("players/guest/uid").set(cred.user.uid);
        roomRef.child("players/guest/connected").set(true);
        roomRef.child("players/guest/connected").onDisconnect().set(false);
        // status購読は guestwait 監視の useEffect に一本化したためここでは不要
        setScreen("guestwait");
      });
    } else {
      auth.signInAnonymously().then(cred=>{
        setUid(cred.user.uid);
        setScreen("top");
      });
    }
  },[]);

  function loadCSV(){
    setLoadError(null);
    fetch(CSV_PATH)
      .then(res=>{ if(!res.ok) throw new Error(`HTTPエラー ${res.status}`); return res.text(); })
      .then(text=>{
        const data = parseCSV(text);
        if(data.length===0) throw new Error("CSVにデータがありません");
        setAllCompanies(data);
      })
      .catch(err=>{ setLoadError(err.message || "不明なエラー"); });
  }

  function goResult(selected, guesses){
    const total = selected.reduce((s,c)=>s+c.cho, 0);
    const isDobun = total > TARGET[difficulty];
    setResult({selected, isDobun, guesses});
    setScreen("result");
  }

  // ── 修正①：startVsGame でその都度企業を抽出・Firebase に保存 ──
  // 初回もリトライ時もここを通るので企業リストは常に新規抽出
  // setGameKey はホスト側のみここで行う（ゲストは guestwait 監視の useEffect で行う）
  function startVsGame(){
    const newCompanies = selectCompanies(allCompanies);
    setCompanies(newCompanies);
    setGameKey(k=>k+1); // ホスト専用：ゲストは guestwait 監視側でインクリメント

    const roomRef = db.ref(`rooms/${roomId}`);
    const companiesObj = {};
    newCompanies.forEach(c=>{ companiesObj[c.code]={name:c.name, oku:c.oku, cho:c.cho}; });
    const ft = Math.random() < 0.5 ? "host" : "guest";
    setFirstTurn(ft);
    roomRef.update({
      status: "playing",
      companies: companiesObj,
      "turn/current": ft,
      "turn/startedAt": firebase.database.ServerValue.TIMESTAMP,
      "players/host/stopped": false,
      "players/host/selections": null,
      "players/guest/stopped": false,
      "players/guest/selections": null,
      "timer/startedAt": firebase.database.ServerValue.TIMESTAMP,
    });
    setScreen("countdown");
  }

  function createRoom(diff){
    setDiff(diff);
    const rid = generateRoomId();
    setRoomId(rid);
    setRole("host");
    setMode("vs");

    const hostUid = (auth.currentUser && auth.currentUser.uid) ? auth.currentUser.uid : uid;
    const roomRef = db.ref(`rooms/${rid}`);
    roomRef.set({
      status: "waiting",
      difficulty: diff,
      targetAmount: TARGET[diff],
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      expiresAt: Date.now() + 2*60*60*1000,
      players: {
        host: { uid: hostUid, connected:true, stopped:false },
        guest: { connected:false, stopped:false },
      }
    });
    roomRef.child("players/host/connected").onDisconnect().set(false);
    roomRef.child("players/guest/connected").on("value", snap=>{
      if(snap.val()===true) setGuestJoined(true);
    });
    setScreen("roomwait");
  }

  // ── 再戦：ホストは自動スタート、ゲストは再戦リクエストフラグを立てて待機 ──
  function retryVsGame(){
    if(role === "host"){
      // ホスト：即ゲスト待機画面へ遷移してから自動スタート
      db.ref(`rooms/${roomId}/retryRequested`).set(false);
      setScreen("guestwait");
      startVsGame();
    } else {
      // ゲスト：Firebase に再戦リクエストフラグを立てて待機
      db.ref(`rooms/${roomId}/retryRequested`).set(true);
      setScreen("guestwait");
    }
  }

  function goVsResult(mySelected, oppSelected, guesses, isDisconnect){
    setVsResult({mySelected, oppSelected, guesses, isDisconnect});
    setScreen("vsresult");
  }

  // ── 再戦監視：vsresult 表示中に Firebase の変化を監視 ──
  // ゲストが押した → retryRequested:true → ホストのボタンが変化
  // ホストが押した → status:"playing" → 両者ゲスト待機画面へ
  // ④ 修正：vsresult に遷移した直後は status がまだ "playing" の場合がある。
  //    "finished" を一度確認してから "playing" を監視する2段階方式にして誤検知を防ぐ。
  const [retryRequested, setRetryRequested] = useState(false);
  useEffect(()=>{
    if(screen !== "vsresult" || !roomId) return;
    setRetryRequested(false);
    const retryRef  = db.ref(`rooms/${roomId}/retryRequested`);
    const statusRef = db.ref(`rooms/${roomId}/status`);
    let finishedSeen = false; // "finished" を一度見たかどうかのフラグ

    retryRef.on("value", snap=>{
      if(snap.val()===true) setRetryRequested(true);
    });
    statusRef.on("value", snap=>{
      const s = snap.val();
      if(s === "finished"){
        finishedSeen = true; // "finished" を確認
        return;
      }
      // "finished" を見た後に "playing" になった = 再戦スタート
      if(s === "playing" && finishedSeen){
        retryRef.off();
        statusRef.off();
        setScreen("guestwait");
      }
    });
    return ()=>{ retryRef.off(); statusRef.off(); };
  },[screen, roomId]);


  // ── guestwait 監視：ホスト・ゲスト両方、guestwait 中に status:"playing" を検知したらカウントダウンへ ──
  // 初回入室時の購読に頼らず、guestwait 画面になるたびに必ず監視を張り直す
  // ④ "finished" が来た場合は無視（ゲーム終了直後に誤ってカウントダウンへ飛ぶバグを防ぐ）
  useEffect(()=>{
    if(screen !== "guestwait" || !roomId) return;
    const roomRef   = db.ref(`rooms/${roomId}`);
    const statusRef = roomRef.child("status");
    statusRef.on("value", snap=>{
      const s = snap.val();
      if(s === "finished") return; // ゲーム終了は無視
      if(s === "playing"){
        statusRef.off();
        roomRef.once("value", roomSnap=>{
          const roomData = roomSnap.val() || {};
          const diff = roomData.difficulty || "normal";
          setDiff(diff);
          const companiesObj = roomData.companies || {};
          const companiesList = Object.entries(companiesObj)
            .map(([code, v])=>({ code, name:v.name, oku:v.oku, cho:v.cho, rankCD:0 }))
            .sort((a,b)=>a.code.localeCompare(b.code, undefined, {numeric:true}));
          setCompanies(companiesList);
          const ft = roomData.turn?.current || "host";
          setFirstTurn(ft);
          // ゲストのみ gameKey をインクリメント（ホストは startVsGame() で済み）
          if(role === "guest") setGameKey(k=>k+1);
          setScreen("countdown");
        });
      }
    });
    return ()=>statusRef.off();
  },[screen, roomId]);

  if(screen==="loading" || (allCompanies===null && loadError===null)) return <LoadingScreen />;
  if(loadError) return <ErrorScreen message={loadError} onRetry={loadCSV} />;

  return (
    <>
      {screen==="top" && (
        <TopScreen
          onSolo={()=>{ setMode("solo"); setCompanies(selectCompanies(allCompanies)); setScreen("difficulty"); }}
          onVs={()=>{ setMode("vs"); setScreen("difficulty"); }}
        />
      )}
      {screen==="difficulty" && (
        <DifficultyScreen
          onBack={()=>setScreen("top")}
          onDecide={d=>{
            if(mode==="solo"){ setDiff(d); setCompanies(selectCompanies(allCompanies)); setScreen("game"); }
            else { createRoom(d); }
          }}
        />
      )}
      {screen==="game" && (
        <GameScreen key={gameKey} difficulty={difficulty} companies={companies}
          onStop={(s,g)=>goResult(s,g)} onTimeout={(s,g)=>goResult(s,g)}
        />
      )}
      {screen==="result" && (
        <ResultScreen difficulty={difficulty} selected={result.selected}
          isDobun={result.isDobun} guesses={result.guesses||{}}
          onRetry={()=>setScreen("difficulty")} onTop={()=>setScreen("top")}
        />
      )}
      {screen==="guestwait" && <GuestWaitScreen/>}
      {screen==="roomwait" && (
        <RoomWaitScreen
          roomId={roomId} role={role} difficulty={difficulty}
          guestJoined={guestJoined}
          onStart={startVsGame}
          onLeave={()=>{ setScreen("top"); setRoomId(null); setRole(null); setGuestJoined(false); }}
        />
      )}
      {screen==="countdown" && (
        <CountdownScreen
          myTurn={firstTurn===role}
          onDone={()=>setScreen("vsgame")}
        />
      )}
      {screen==="vsgame" && (
        <VsGameScreen
          key={gameKey} difficulty={difficulty} companies={companies}
          role={role} roomId={roomId} uid={uid}
          onGameEnd={(my, opp, g, isDisconnect)=>goVsResult(my, opp, g, isDisconnect)}
          onRetry={()=>{ setGuestJoined(true); setScreen("roomwait"); }}
        />
      )}
      {screen==="vsresult" && (
        <VsResultScreen
          difficulty={difficulty}
          mySelected={vsResult.mySelected} oppSelected={vsResult.oppSelected}
          role={role} isDisconnect={vsResult.isDisconnect}
          retryRequested={retryRequested}
          guesses={vsResult.guesses||{}}
          onRetry={retryVsGame}
          onTop={()=>{ setScreen("top"); setRoomId(null); setRole(null); setGuestJoined(false); }}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
